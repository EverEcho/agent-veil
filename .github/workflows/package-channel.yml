name: Package release channel

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel; run this workflow from the matching branch
        required: true
        type: choice
        options: [dev, beta, release]
        default: dev
      version:
        description: Package version without a leading v
        required: true
        type: string
        default: 0.0.0
      quality_statement:
        description: Confirm the quality level required by the selected channel
        required: true
        type: choice
        options:
          - dev-no-fatal
          - beta-self-tested-no-known
          - release-fully-verified-no-known
        default: dev-no-fatal
      publish_release:
        description: Also create a GitHub Release (dev/beta are prereleases)
        required: true
        type: boolean
        default: false
      source_sha:
        description: Exact commit to package; local release.sh supplies this automatically
        required: false
        type: string

permissions:
  contents: write

env:
  GO_VERSION: "1.27.x"
  SOURCE_SHA: ${{ inputs.source_sha || github.sha }}

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHANNEL: ${{ inputs.channel }}
      VERSION: ${{ inputs.version }}
      QUALITY_STATEMENT: ${{ inputs.quality_statement }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test updater manifest generation
        run: python3 -m unittest scripts/test_generate_update_manifest.py

      - name: Enforce branch and quality policy
        shell: bash
        run: |
          expected_branch="$(jq -r --arg channel "${CHANNEL}" '.[$channel].branch // empty' .github/release-channels.json)"
          expected_statement="$(jq -r --arg channel "${CHANNEL}" '.[$channel].quality_statement // empty' .github/release-channels.json)"
          if [ -z "${expected_branch}" ] || [ -z "${expected_statement}" ]; then
            echo "::error::Unknown release channel: ${CHANNEL}"
            exit 1
          fi
          if [ "${GITHUB_REF}" != "refs/heads/${expected_branch}" ]; then
            echo "::error::Channel ${CHANNEL} must be packaged from branch ${expected_branch}, not ${GITHUB_REF}."
            exit 1
          fi
          git fetch --no-tags origin "refs/heads/${expected_branch}:refs/remotes/origin/${expected_branch}"
          if ! git merge-base --is-ancestor "${SOURCE_SHA}" "origin/${expected_branch}"; then
            echo "::error::Source commit ${SOURCE_SHA} is not reachable from ${expected_branch}."
            exit 1
          fi
          if [ "${QUALITY_STATEMENT}" != "${expected_statement}" ]; then
            echo "::error::Channel ${CHANNEL} requires quality statement ${expected_statement}."
            exit 1
          fi
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be numeric SemVer such as 0.1.1; the workflow adds the channel suffix to release tags."
            exit 1
          fi
          expected_tag="v${VERSION}"
          if [ "${CHANNEL}" != release ]; then expected_tag="v${VERSION}-${CHANNEL}"; fi
          for tag in "v${VERSION}" "v${VERSION}-dev" "v${VERSION}-beta"; do
            if [ "${tag}" != "${expected_tag}" ] && git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "::error::Numeric version ${VERSION} is already assigned to another channel (${tag})."
              exit 1
            fi
          done

      - name: Install Linux desktop test dependencies
        if: env.CHANNEL == 'beta' || env.CHANNEL == 'release'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            pkg-config \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev

      - name: Fast development gate
        if: env.CHANNEL == 'dev'
        run: |
          # Dev prioritizes producing a testable package. Formatting is applied
          # only inside this disposable checkout; beta/main still reject drift.
          gofmt -w .
          go vet ./...
          go test ./internal/core ./internal/proxy ./internal/session ./sdk/attach

      - name: Beta gate
        if: env.CHANNEL == 'beta'
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          make acceptance-evidence

      - name: Release gate
        if: env.CHANNEL == 'release'
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          make acceptance-evidence

      - name: Build Core packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/bin dist/meta
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            suffix=""
            if [ "${goos}" = windows ]; then suffix=".exe"; fi
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build \
              -trimpath -buildvcs=false \
              -ldflags="-s -w" \
              -o "dist/bin/veil-${goos}-${goarch}${suffix}" ./cmd/veil
          done
          dist/bin/veil-linux-amd64 compatibility --offline > dist/meta/COMPATIBILITY.json
          jq -n \
            --arg channel "${CHANNEL}" \
            --arg version "${VERSION}" \
            --arg commit "${SOURCE_SHA}" \
            --arg statement "${QUALITY_STATEMENT}" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{channel:$channel,version:$version,commit:$commit,quality_statement:$statement,built_at:$built_at}' \
            > dist/meta/CHANNEL.json
          cp README.md dist/
          if [ -f LICENSE ]; then cp LICENSE dist/; fi
          (
            cd dist
            find bin meta -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          archive="agentveil-${VERSION}-${CHANNEL}"
          tar -C dist -czf "${archive}.tar.gz" .
          (
            cd dist
            zip -q -r "../${archive}.zip" .
          )
          mkdir artifacts
          mv "${archive}.tar.gz" "${archive}.zip" artifacts/

      - name: Upload channel package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentveil-${{ env.VERSION }}-${{ env.CHANNEL }}
          path: artifacts/
          if-no-files-found: error
          retention-days: ${{ env.CHANNEL == 'release' && 90 || env.CHANNEL == 'beta' && 30 || 14 }}

  desktop:
    needs: package
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: amd64
            core: veil
            bundles: deb,appimage
          - runner: macos-15
            platform: macos
            arch: arm64
            core: veil
            bundles: app,dmg
          - runner: macos-15-intel
            platform: macos
            arch: amd64
            core: veil
            bundles: app,dmg
          - runner: windows-2025
            platform: windows
            arch: amd64
            core: veil.exe
            bundles: nsis,msi
    runs-on: ${{ matrix.runner }}
    env:
      CHANNEL: ${{ inputs.channel }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install prebuilt Tauri CLI
        shell: bash
        run: npm install --global @tauri-apps/cli@2.11.4
      - name: Configure macOS signing
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PREFERRED_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE}" ]; then
            if [ "${CHANNEL}" = release ]; then
              echo "::error::release requires a Developer ID Application certificate and notarization credentials."
              exit 1
            fi
            echo "MACOS_DISTRIBUTION_SIGNED=false" >> "${GITHUB_ENV}"
            echo "::notice::No Apple certificate configured; using the ad-hoc identity for ${CHANNEL}."
            exit 0
          fi

          for name in APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is required when APPLE_CERTIFICATE is configured."
              exit 1
            fi
          done

          certificate_path="${RUNNER_TEMP}/agentveil-certificate.p12"
          keychain_path="${RUNNER_TEMP}/agentveil-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "${APPLE_CERTIFICATE}" | base64 --decode > "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" -k "${keychain_path}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"

          identity="${PREFERRED_SIGNING_IDENTITY}"
          if [ -z "${identity}" ]; then
            identity="$(security find-identity -v -p codesigning "${keychain_path}" \
              | awk -F\" '/Developer ID Application/{print $2; exit}')"
          fi
          if [ -z "${identity}" ]; then
            echo "::error::The imported certificate contains no Developer ID Application identity."
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=${identity}" >> "${GITHUB_ENV}"
          echo "SIGNING_KEYCHAIN=${keychain_path}" >> "${GITHUB_ENV}"
          echo "MACOS_DISTRIBUTION_SIGNED=true" >> "${GITHUB_ENV}"
      - name: Build matching Core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p desktop/src-tauri/resources artifacts
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-s -w" \
            -o "desktop/src-tauri/resources/${{ matrix.core }}" ./cmd/veil
      - name: Build Tauri desktop bundles
        working-directory: desktop
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ] || [ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" ]; then
            echo "::error::TAURI updater signing secrets are required."
            exit 1
          fi
          if [ "${MACOS_DISTRIBUTION_SIGNED:-false}" != true ]; then
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          cargo_args=()
          profile_dir=release
          if [ "${CHANNEL}" = dev ]; then
            cargo_args=(-- --profile dev-package)
            profile_dir=dev-package
          fi
          AGENTVEIL_CHANNEL="${CHANNEL}" tauri build --bundles "${{ matrix.bundles }}" --config "{\"version\":\"${VERSION}\"}" "${cargo_args[@]}"
          find "src-tauri/target/${profile_dir}/bundle" -maxdepth 4 -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.app.tar.gz' -o -name '*.sig' \) -exec cp {} ../artifacts/ \;
          cd ../artifacts
          for file in *; do mv "${file}" "agentveil-${VERSION}-${CHANNEL}-${{ matrix.platform }}-${{ matrix.arch }}-${file}"; done
          checksum="agentveil-${VERSION}-${CHANNEL}-${{ matrix.platform }}-${{ matrix.arch }}.SHA256SUMS"
          if command -v sha256sum >/dev/null; then sha256sum * > "${checksum}"; else shasum -a 256 * > "${checksum}"; fi
      - name: Verify macOS signature and notarization
        if: matrix.platform == 'macos'
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          profile_dir=release
          if [ "${CHANNEL}" = dev ]; then profile_dir=dev-package; fi
          app_path="$(find "src-tauri/target/${profile_dir}/bundle/macos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "${app_path}"
          codesign --verify --deep --strict --verbose=2 "${app_path}"
          if [ "${MACOS_DISTRIBUTION_SIGNED}" = true ]; then
            dmg_path="$(find "src-tauri/target/${profile_dir}/bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
            test -n "${dmg_path}"
            xcrun stapler validate "${dmg_path}"
            spctl --assess --type execute --verbose=2 "${app_path}"
          fi
      - name: Smoke-test bundled macOS Core
        if: matrix.platform == 'macos'
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          profile_dir=release
          if [ "${CHANNEL}" = dev ]; then profile_dir=dev-package; fi
          app_path="$(find "src-tauri/target/${profile_dir}/bundle/macos" -maxdepth 1 -name '*.app' -print -quit)"
          core_path="${app_path}/Contents/Resources/resources/veil"
          test -x "${core_path}"

          smoke_home="${RUNNER_TEMP}/agentveil-core-smoke-home"
          state_path="${smoke_home}/Library/Application Support/agentveil/core.json"
          log_path="${RUNNER_TEMP}/agentveil-core-smoke.log"
          token="$(openssl rand -hex 32)"
          # Core creates its state directory with owner-only permissions.
          HOME="${smoke_home}" VEIL_ADMIN_TOKEN="${token}" \
            "${core_path}" serve >"${log_path}" 2>&1 &
          core_pid=$!
          cleanup() {
            kill "${core_pid}" 2>/dev/null || true
            wait "${core_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in {1..200}; do
            if ! kill -0 "${core_pid}" 2>/dev/null; then
              echo "::error::Bundled macOS Core exited during startup."
              sed -n '1,160p' "${log_path}"
              exit 1
            fi
            if [ -f "${state_path}" ]; then
              endpoint="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["api_endpoint"])' "${state_path}")"
              if curl --fail --silent --show-error \
                -H 'X-AgentVeil-API-Version: v1' "${endpoint}/v1/identity" >/dev/null \
                && curl --fail --silent --show-error \
                -H 'X-AgentVeil-API-Version: v1' -H "Authorization: Bearer ${token}" \
                "${endpoint}/v1/health" >/dev/null; then
                exit 0
              fi
            fi
            sleep 0.1
          done
          echo "::error::Bundled macOS Core did not become healthy within 20 seconds."
          sed -n '1,160p' "${log_path}"
          exit 1
      - name: Remove temporary macOS signing keychain
        if: always() && matrix.platform == 'macos'
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/agentveil-certificate.p12"
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "${SIGNING_KEYCHAIN}" || true
          fi
      - name: Upload desktop package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentveil-desktop-${{ env.VERSION }}-${{ env.CHANNEL }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: error
          retention-days: ${{ env.CHANNEL == 'release' && 90 || env.CHANNEL == 'beta' && 30 || 14 }}

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: [package, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHANNEL: ${{ inputs.channel }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Publish immutable release and channel manifest
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          release_args=()
          if [ "${CHANNEL}" != release ]; then
            release_args+=(--prerelease)
            if [[ "${VERSION}" != *-"${CHANNEL}"* ]]; then tag="v${VERSION}-${CHANNEL}"; fi
          fi
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${tag}" release-artifacts/* --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" \
              --title "AgentVeil ${VERSION} (${CHANNEL})" "${release_args[@]}"
          else
            gh release create "${tag}" release-artifacts/* \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${SOURCE_SHA}" \
              --title "AgentVeil ${VERSION} (${CHANNEL})" \
              --generate-notes "${release_args[@]}"
          fi
          python3 scripts/generate-update-manifest.py \
            --artifacts release-artifacts \
            --repository "${GITHUB_REPOSITORY}" \
            --channel "${CHANNEL}" \
            --version "${VERSION}" \
            --tag "${tag}" \
            --output latest.json
          index_tag="agentveil-updates-${CHANNEL}"
          if gh release view "${index_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${index_tag}" latest.json --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${index_tag}" latest.json --prerelease \
              --repo "${GITHUB_REPOSITORY}" --target "${SOURCE_SHA}" \
              --title "AgentVeil ${CHANNEL} update index" \
              --notes "Machine-readable signed updater index for the ${CHANNEL} channel."
          fi
