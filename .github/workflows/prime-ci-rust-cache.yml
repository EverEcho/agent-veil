name: Prime CI Rust cache

on:
  push:
    branches:
      - main
    paths:
      - desktop/src-tauri/Cargo.lock
      - desktop/src-tauri/Cargo.toml
      - .github/workflows/ci.yml
      - .github/workflows/prime-ci-rust-cache.yml

permissions:
  contents: read

jobs:
  prime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            pkg-config \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev
      - name: Install minimum supported Rust
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup override set 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri -> target
          shared-key: ci-desktop
      - name: Compile desktop dependencies for PRs
        run: |
          cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml
          cargo test --locked --no-run --manifest-path desktop/src-tauri/Cargo.toml
