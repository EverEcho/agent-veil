name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.23.x"
          cache: true
      - run: gofmt -w . && git diff --exit-code
      - run: go vet ./...
      - name: Test and scan logs for sensitive canary
        env:
          VEIL_CI_LEAK_CANARY: ghp_AgentVeilCILogCanary0123456789
        run: |
          output="$(mktemp "${RUNNER_TEMP}/agentveil-test-output.XXXXXX")"
          trap 'rm -f "${output}"' EXIT
          set +e
          VEIL_TEST_LEAK_CANARY="${VEIL_CI_LEAK_CANARY}" go test -race -coverprofile=coverage.out ./... >"${output}" 2>&1
          test_code=$?
          set -e
          if grep -Fq -- "${VEIL_CI_LEAK_CANARY}" "${output}"; then
            echo "::error::Sensitive canary reached test output; log withheld"
            exit 1
          fi
          cat "${output}"
          exit "${test_code}"
      - name: Enforce pure-rule pipeline P95 budget
        env:
          VEIL_PERFORMANCE_GATE: "1"
        run: go test ./internal/pipeline -run '^TestPureRulePipelineP95Budget$' -count=1 -v
      - name: Reproduce documented acceptance evidence
        run: make acceptance-evidence
      - run: go build -trimpath ./cmd/veil

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.23.x"
          cache: true
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o veil-${GOOS}-${GOARCH} ./cmd/veil

  desktop-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.23.x"
          cache: false
      - name: Compile desktop shell with in-memory driver
        working-directory: desktop
        run: |
          go mod tidy
          go build -tags ci -trimpath -o agentveil-desktop .

  reproducible-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.23.x"
          cache: true
      - name: Compare independent release builds
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -buildvcs=false -o "${RUNNER_TEMP}/veil-first" ./cmd/veil
          go clean -cache
          go build -trimpath -buildvcs=false -o "${RUNNER_TEMP}/veil-second" ./cmd/veil
          sha256sum "${RUNNER_TEMP}/veil-first" "${RUNNER_TEMP}/veil-second"
          cmp --silent "${RUNNER_TEMP}/veil-first" "${RUNNER_TEMP}/veil-second"

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.23.x"
          cache: true
      - name: Fuzz protocol parsing
        run: go test ./internal/protocol -run=^$ -fuzz=FuzzParseNeverAcceptsMalformedTrailingData -fuzztime=20s
      - name: Fuzz protocol endpoint traversal
        run: go test ./internal/protocol -run=^$ -fuzz=FuzzExpectedProtocolEndpointCannotTraverse -fuzztime=20s
      - name: Fuzz SSE chunk boundaries
        run: go test ./internal/stream -run=^$ -fuzz=FuzzSSEDecoderChunkingInvariant -fuzztime=20s
      - name: Fuzz Session and Route capabilities
        run: go test ./internal/session -run=^$ -fuzz=FuzzRouteCapabilityRequiresExactTuple -fuzztime=20s
      - name: Fuzz Upstream origin allowlisting
        run: go test ./internal/security -run=^$ -fuzz=FuzzUpstreamAllowlistRejectsOriginConfusion -fuzztime=20s

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.23.x"
          cache: true
      - name: Install pinned govulncheck
        env:
          GOBIN: ${{ runner.temp }}/govulncheck-bin
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.0.4
      - name: Scan reachable Go vulnerabilities
        run: ${{ runner.temp }}/govulncheck-bin/govulncheck ./...

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.23.x"
          cache: true
      - run: go build -trimpath -o veil-linux-amd64 ./cmd/veil
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: veil-linux-amd64
          format: spdx-json
          output-file: veil-linux-amd64.spdx.json
          upload-release-assets: false

  release-evidence:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, cross-build, reproducible-build, vulnerability-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.23.x"
          cache: true
      - name: Build release subjects
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            suffix=""
            if [ "${GOOS}" = windows ]; then suffix=".exe"; fi
            GOOS="${GOOS}" GOARCH="${GOARCH}" go build -trimpath -buildvcs=false -o "dist/veil-${GOOS}-${GOARCH}${suffix}" ./cmd/veil
          done
          dist/veil-linux-amd64 compatibility --offline > dist/COMPATIBILITY.json
          sha256sum dist/veil-* dist/COMPATIBILITY.json > dist/SHA256SUMS
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: dist/veil-linux-amd64
          format: spdx-json
          output-file: dist/veil-linux-amd64.spdx.json
          upload-release-assets: false
      - name: Attest release build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/veil-linux-amd64
            dist/veil-linux-arm64
            dist/veil-darwin-amd64
            dist/veil-darwin-arm64
            dist/veil-windows-amd64.exe
            dist/veil-windows-arm64.exe
            dist/COMPATIBILITY.json
            dist/SHA256SUMS
      - name: Attest Linux SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/veil-linux-amd64
          sbom-path: dist/veil-linux-amd64.spdx.json
      - name: Upload attested release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentveil-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
