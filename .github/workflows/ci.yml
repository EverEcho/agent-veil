name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.23.x"
          cache: true
      - run: gofmt -w . && git diff --exit-code
      - run: go vet ./...
      - name: Test and scan logs for sensitive canary
        env:
          VEIL_CI_LEAK_CANARY: ghp_AgentVeilCILogCanary0123456789
        run: |
          output="$(mktemp "${RUNNER_TEMP}/agentveil-test-output.XXXXXX")"
          trap 'rm -f "${output}"' EXIT
          set +e
          VEIL_TEST_LEAK_CANARY="${VEIL_CI_LEAK_CANARY}" go test -race -coverprofile=coverage.out ./... >"${output}" 2>&1
          test_code=$?
          set -e
          if grep -Fq -- "${VEIL_CI_LEAK_CANARY}" "${output}"; then
            echo "::error::Sensitive canary reached test output; log withheld"
            exit 1
          fi
          cat "${output}"
          exit "${test_code}"
      - run: go build -trimpath ./cmd/veil

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.23.x"
          cache: true
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o veil-${GOOS}-${GOARCH} ./cmd/veil

  reproducible-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.23.x"
          cache: true
      - name: Compare independent release builds
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -buildvcs=false -o "${RUNNER_TEMP}/veil-first" ./cmd/veil
          go clean -cache
          go build -trimpath -buildvcs=false -o "${RUNNER_TEMP}/veil-second" ./cmd/veil
          sha256sum "${RUNNER_TEMP}/veil-first" "${RUNNER_TEMP}/veil-second"
          cmp --silent "${RUNNER_TEMP}/veil-first" "${RUNNER_TEMP}/veil-second"

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.23.x"
          cache: true
      - name: Fuzz protocol parsing
        run: go test ./internal/protocol -run=^$ -fuzz=FuzzParseNeverAcceptsMalformedTrailingData -fuzztime=20s
      - name: Fuzz protocol endpoint traversal
        run: go test ./internal/protocol -run=^$ -fuzz=FuzzExpectedProtocolEndpointCannotTraverse -fuzztime=20s
      - name: Fuzz SSE chunk boundaries
        run: go test ./internal/stream -run=^$ -fuzz=FuzzSSEDecoderChunkingInvariant -fuzztime=20s
      - name: Fuzz Session and Route capabilities
        run: go test ./internal/session -run=^$ -fuzz=FuzzRouteCapabilityRequiresExactTuple -fuzztime=20s
      - name: Fuzz Upstream origin allowlisting
        run: go test ./internal/security -run=^$ -fuzz=FuzzUpstreamAllowlistRejectsOriginConfusion -fuzztime=20s

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.23.x"
          cache: true
      - name: Install pinned govulncheck
        env:
          GOBIN: ${{ runner.temp }}/govulncheck-bin
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.0.4
      - name: Scan reachable Go vulnerabilities
        run: ${{ runner.temp }}/govulncheck-bin/govulncheck ./...

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.23.x"
          cache: true
      - run: go build -trimpath -o veil-linux-amd64 ./cmd/veil
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: veil-linux-amd64
          format: spdx-json
          output-file: veil-linux-amd64.spdx.json
          upload-release-assets: false
